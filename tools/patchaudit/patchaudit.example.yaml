# Флаги главнее конфига. Путь: --config или $PATCHAUDIT_CONFIG.
koji:
  hub: https://koji.example.com/kojihub
  tag: sl9-updates
rhel: "9"  # точная версия: "9.2" и "9" — разные потоки

gitlab:
  default_host: gitlab.example.com
  token: ""  # токен GitLab с read_api; пусто — только публичные проекты
  patch_dir: PATCH
  retries: 3
  timeout: 30
  hosts:
    gitlab.example.com:
      api: https://gitlab.example.com/api/v4

vex:
  # cache_dir: ~/.cache/patchaudit
  cache_ttl: 3600
  jobs: 8
  retries: 3
  timeout: 30

vmaas:
  arch: x86_64
  # cache_dir: ~/.cache/patchaudit/vmaas
  cache_ttl: 3600
  retries: 3
  timeout: 30

# Модули задаются явно; без записи ищется обычный пакет.
vex_streams:
  "9":
    nginx: nginx:1.26
    npm: nodejs:20

# Имена бинарных пакетов, которыми Red Hat обозначает исходный пакет.
vex_names:
  rust-afterburn: [afterburn, afterburn-dracut]
