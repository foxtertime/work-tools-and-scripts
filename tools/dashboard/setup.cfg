[metadata]
name = dashboard
# Номер версии написан в одном месте — dashboard/__init__.py, — и отсюда же
# его читают CLI, снапшот и собранная страница.
version = attr: dashboard.__version__
description = Дашборд патчей koji и GitLab

[options]
packages = dashboard
python_requires = >=3.9
# Зависимости здесь не перечислены нарочно. koji, requests и PyYAML ставят
# системным пакетным менеджером — там они собраны под тот же питон, что и
# сам koji-клиент. Прибив их версии здесь, мы дрались бы с дистрибутивом за
# один и тот же файл; см. README, раздел «Установка».
include_package_data = True

[options.package_data]
# Шаблон, стили и скрипты — часть пакета, а не побочные файлы: без них
# сборка страницы не соберёт ничего.
dashboard =
    assets/*.html
    assets/js/*.js
    assets/css/*.css

[options.entry_points]
console_scripts =
    dashboard = dashboard.cli:main
